<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>مختبر ومستخرج الإذاعات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --primary: #00f2fe;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        h1 { text-align: center; color: var(--primary); margin-bottom: 10px; }
        
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid rgba(0, 242, 254, 0.2); }
        .card-title { font-size: 1.2rem; margin-bottom: 15px; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        
        input[type="text"], textarea {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155;
            background: #0b1120; color: white; margin-bottom: 15px; font-size: 1rem; text-align: left; direction: ltr;
        }
        textarea { height: 150px; resize: vertical; }
        input:focus, textarea:focus { outline: none; border-color: var(--primary); }

        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        button {
            padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
            transition: all 0.2s; display: flex; align-items: center; gap: 8px; font-size: 1rem;
        }
        .btn-primary { background: var(--primary); color: #000; }
        .btn-primary:hover { background: #00c3cc; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-secondary { background: #334155; color: white; }
        .btn-secondary:hover { background: #475569; }

        .player-status { margin-top: 15px; padding: 10px; border-radius: 8px; background: #000; display: flex; justify-content: space-between; align-items: center; }
        .status-text { color: #94a3b8; font-size: 0.9rem; }
        .status-playing { color: #22c55e; font-weight: bold; }
        .status-error { color: #ef4444; font-weight: bold; }

        .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .count-badge { background: var(--primary); color: #000; padding: 3px 10px; border-radius: 20px; font-size: 0.9rem; font-weight: bold; }
        
        .station-item {
            background: #0f172a; border: 1px solid #334155; padding: 15px; border-radius: 8px;
            margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        .station-info { flex: 1; min-width: 250px; }
        .station-name { font-weight: bold; margin-bottom: 5px; color: #e2e8f0; }
        .station-url { font-size: 0.85rem; color: #64748b; word-break: break-all; direction: ltr; text-align: left; }
        .station-actions { display: flex; gap: 10px; }

        audio { width: 100%; margin-top: 15px; outline: none; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h1><i class="fas fa-satellite-dish"></i> أداة اختبار واستخراج الإذاعات</h1>

    <!-- قسم الاختبار السريع -->
    <div class="card">
        <div class="card-title"><i class="fas fa-play-circle"></i> اختبار رابط سريع</div>
        <input type="text" id="quickUrl" placeholder="الصق رابط الإذاعة هنا (مثال: http://stream.zeno.fm/...)">
        <div class="btn-group">
            <button class="btn-primary" onclick="testQuickUrl()"><i class="fas fa-play"></i> تشغيل</button>
            <button class="btn-danger" onclick="stopPlayer()"><i class="fas fa-stop"></i> إيقاف</button>
        </div>
        
        <div class="player-status">
            <span id="playerStatus" class="status-text">متوقف</span>
            <span id="currentTestUrl" style="font-size: 0.8rem; color: #64748b; direction: ltr;"></span>
        </div>
        <audio id="audioPlayer" controls></audio>
    </div>

    <!-- قسم الاستخراج -->
    <div class="card">
        <div class="card-title"><i class="fas fa-code"></i> استخراج الروابط من نص أو M3U</div>
        <textarea id="extractInput" placeholder="الصق كود M3U بالكامل هنا، أو الصق أي نص يحتوي على روابط..."></textarea>
        <div class="btn-group">
            <button class="btn-primary" onclick="extractStations()"><i class="fas fa-search"></i> استخراج الإذاعات</button>
            <button class="btn-secondary" onclick="document.getElementById('extractInput').value=''"><i class="fas fa-trash"></i> مسح النص</button>
        </div>
    </div>

    <!-- قسم النتائج -->
    <div class="card" id="resultsCard" style="display: none;">
        <div class="results-header">
            <div class="card-title" style="margin:0;"><i class="fas fa-list"></i> النتائج</div>
            <div class="count-badge">العدد: <span id="stationCount">0</span></div>
        </div>
        <div id="resultsList"></div>
    </div>
</div>

<script>
    const audioPlayer = document.getElementById('audioPlayer');
    const playerStatus = document.getElementById('playerStatus');
    const currentTestUrl = document.getElementById('currentTestUrl');
    let hlsInstance = null;

    // مشغل الراديو الذكي
    function playStream(url) {
        stopPlayer();
        currentTestUrl.textContent = url;
        playerStatus.textContent = "جاري الاتصال...";
        playerStatus.className = "status-text text-warning";

        if ((url.includes('.m3u8') || url.includes('.ts')) && Hls.isSupported()) {
            hlsInstance = new Hls();
            hlsInstance.loadSource(url);
            hlsInstance.attachMedia(audioPlayer);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                audioPlayer.play().catch(e => setPlayerError());
            });
            hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) setPlayerError();
            });
        } else {
            audioPlayer.src = url;
            audioPlayer.play().catch(e => setPlayerError());
        }
    }

    function stopPlayer() {
        if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
        audioPlayer.pause();
        audioPlayer.removeAttribute('src');
        audioPlayer.load();
        playerStatus.textContent = "متوقف";
        playerStatus.className = "status-text";
    }

    audioPlayer.addEventListener('playing', () => {
        playerStatus.textContent = "يعمل بنجاح";
        playerStatus.className = "status-text status-playing";
    });

    audioPlayer.addEventListener('error', setPlayerError);

    function setPlayerError() {
        playerStatus.textContent = "الرابط لا يعمل أو محمي";
        playerStatus.className = "status-text status-error";
    }

    function testQuickUrl() {
        const url = document.getElementById('quickUrl').value.trim();
        if (url) {
            playStream(url);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    // خوارزمية الاستخراج
    function extractStations() {
        const text = document.getElementById('extractInput').value;
        const lines = text.split('\n');
        const stations = [];
        let tempName = '';

        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;

            // محاولة التقاط الاسم من صيغة M3U
            if (line.startsWith('#EXTINF')) {
                const parts = line.split(',');
                if (parts.length > 1) {
                    tempName = parts.slice(1).join(',').trim();
                } else {
                    tempName = 'إذاعة غير معروفة';
                }
            } 
            // التقاط أي رابط http أو https
            else if (line.startsWith('http://') || line.startsWith('https://')) {
                let finalUrl = line.split('#')[0].trim(); // تنظيف الرابط
                const name = tempName || `إذاعة مستخرجة ${stations.length + 1}`;
                stations.push({ name: name, url: finalUrl });
                tempName = ''; 
            }
        }

        // إذا لم يكن النص بصيغة M3U، نبحث عن الروابط العشوائية داخل النص
        if (stations.length === 0) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            let match;
            while ((match = urlRegex.exec(text)) !== null) {
                stations.push({ name: `رابط مستخرج ${stations.length + 1}`, url: match[1] });
            }
        }

        renderResults(stations);
    }

    function renderResults(stations) {
        const resultsCard = document.getElementById('resultsCard');
        const resultsList = document.getElementById('resultsList');
        const stationCount = document.getElementById('stationCount');

        resultsList.innerHTML = '';
        stationCount.textContent = stations.length;

        if (stations.length === 0) {
            resultsCard.style.display = 'block';
            resultsList.innerHTML = '<p style="text-align:center; color:#ef4444;">لم يتم العثور على أي روابط صالحة.</p>';
            return;
        }

        resultsCard.style.display = 'block';

        stations.forEach(station => {
            const item = document.createElement('div');
            item.className = 'station-item';
            
            const cleanUrl = station.url.replace(/"/g, '&quot;');
            
            item.innerHTML = `
                <div class="station-info">
                    <div class="station-name">${station.name}</div>
                    <div class="station-url">${station.url}</div>
                </div>
                <div class="station-actions">
                    <button class="btn-primary" onclick="testExtracted('${cleanUrl}')" title="تجربة"><i class="fas fa-play"></i></button>
                    <button class="btn-secondary" onclick="copyFormat('${station.name}', '${cleanUrl}')" title="نسخ كود الإضافة"><i class="fas fa-copy"></i> كود</button>
                    <button class="btn-secondary" onclick="copyUrl('${cleanUrl}')" title="نسخ الرابط فقط"><i class="fas fa-link"></i></button>
                </div>
            `;
            resultsList.appendChild(item);
        });
    }

    function testExtracted(url) {
        document.getElementById('quickUrl').value = url;
        testQuickUrl();
    }

    function copyFormat(name, url) {
        const format = `{ name: "${name}", url: "${url}" },`;
        navigator.clipboard.writeText(format).then(() => {
            alert("تم نسخ سطر الكود الجاهز للإضافة!");
        });
    }

    function copyUrl(url) {
        navigator.clipboard.writeText(url).then(() => {
            alert("تم نسخ الرابط بنجاح!");
        });
    }
</script>
</body>
</html>
