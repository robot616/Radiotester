<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M3U8 IPTV Player & Tester</title>
    
    <!-- مكتبة JW Player -->
    <script src="https://content.jwplatform.com/libraries/SAHhwvZq.js"></script>
    
    <!-- مكتبة HLS.js + Plyr -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <style>
        body {
            margin: 0; padding: 0; background: #0f0f0f; color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }
        
        .top-panel {
            background: #181818; border-bottom: 2px solid #1dcf60;
            padding: 15px; display: flex; flex-direction: column; gap: 10px;
            z-index: 20; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .top-panel h2 { margin: 0; color: #1dcf60; font-size: 20px; text-align: center; }
        
        .input-group { display: flex; gap: 10px; flex-wrap: wrap; }
        textarea {
            flex: 1; min-width: 300px; height: 70px; background: #111; border: 1px dashed #1dcf60;
            color: #fff; border-radius: 6px; padding: 10px; font-size: 14px;
            resize: none; outline: none; font-family: monospace; direction: ltr; white-space: pre-wrap;
        }
        textarea::placeholder { color: #88c79c; direction: rtl; }
        
        .controls { display: flex; flex-direction: column; gap: 8px; min-width: 250px; flex: 1; max-width: 400px; }
        select, button {
            padding: 10px; background: #222; border: 1px solid #444; color: #fff;
            border-radius: 6px; font-size: 14px; outline: none; cursor: pointer; width: 100%; box-sizing: border-box;
        }
        select:focus { border-color: #1dcf60; }
        
        .buttons-row { display: flex; gap: 10px; }
        button.extract-btn {
            background: #1dcf60; color: #000; font-weight: bold; border: none; transition: 0.2s; flex: 2;
        }
        button.extract-btn:hover { background: #17a84e; transform: scale(1.02); }
        button.clear-btn {
            background: #ff4d4d; color: #fff; font-weight: bold; border: none; transition: 0.2s; flex: 1;
        }
        button.clear-btn:hover { background: #cc0000; }

        .main-content {
            display: flex; flex: 1; overflow: hidden;
        }
        
        .sidebar {
            width: 320px; background: #151515; border-left: 1px solid #333;
            display: flex; flex-direction: column; z-index: 10;
        }
        .search-box { padding: 15px; background: #1c1c1c; border-bottom: 1px solid #333; }
        .search-box input {
            width: 100%; padding: 12px; background: #0a0a0a; border: 1px solid #444;
            color: #fff; border-radius: 6px; font-size: 14px; box-sizing: border-box; outline: none; direction: rtl;
        }
        .search-box input:focus { border-color: #1dcf60; }
        
        .channel-list { flex: 1; overflow-y: auto; padding: 10px; }
        .channel-list::-webkit-scrollbar { width: 6px; }
        .channel-list::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
        
        .channel-btn {
            background: #252525; padding: 12px 15px; margin-bottom: 8px; border-radius: 6px;
            cursor: pointer; font-weight: bold; font-size: 14px; transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: space-between; border: 1px solid transparent;
        }
        .channel-btn:hover { background: #333; border-color: #555; }
        .channel-btn.active { background: #1dcf60; color: #000; border-color: #1dcf60; }
        
        .player-wrapper {
            flex: 1; background: #000; position: relative; display: flex;
            justify-content: center; align-items: center;
        }
        #video-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        .plyr { width: 100%; height: 100%; }
        :root { --plyr-color-main: #1dcf60; }

        .jw-icon-fullscreen svg { display: none !important; }
        .jw-icon-fullscreen {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNOCAzSDVhMiAyIDAgMCAwLTIgMnYzbTE4IDBWNWEyIDIgMCAwIDAtMi0yaC0zbTAgMThoM2EyIDIgMCAwIDAgMi0ydi0zTTMgMTZ2M2EyIDIgMCAwIDAgMiAyaDMiLz48L3N2Zz4=');
            background-size: 55%; background-position: center; background-repeat: no-repeat;
        }
        .jw-flag-fullscreen .jw-icon-fullscreen {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNOCAzdjNhMiAyIDAgMCAxLTIgMkgzbTE4IDBoLTNhMiAyIDAgMCAxLTUtMlYzbTAgMTh2LTNhMiAyIDAgMCAxIDItMmgzTTMgMTZoM2EyIDIgMCAwIDEgMiAydjMiLz48L3N2Zz4=');
        }
        .jw-icon-playlist, .jw-icon-next, .jw-related-btn { display: none !important; }

        @media (max-width: 768px) {
            .main-content { flex-direction: column-reverse; }
            .sidebar { width: 100%; height: 50vh; border-left: none; border-top: 1px solid #333; }
        }
    </style>
</head>
<body>

    <div class="top-panel">
        <h2>أداة استخراج وتشغيل قنوات M3U8 الاحترافية</h2>
        <div class="input-group">
            <textarea id="m3uInput" placeholder="الصق الروابط هنا بأي تنسيق وسيتم الاستخراج..."></textarea>
            
            <div class="controls">
                <select id="playerType">
                    <option value="jw">JW Player (المفضل للـ M3U8 والتايم شيفت)</option>
                    <option value="plyr">Plyr + HLS.js (مشغل احترافي)</option>
                </select>
                
                <div class="buttons-row">
                    <button class="extract-btn" onclick="parseM3U()">استخراج ⚡</button>
                    <button class="clear-btn" onclick="clearAll()">حذف الكل 🗑️</button>
                </div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="player-wrapper">
            <div id="video-container">
                <h3 style="color: #444; margin-top: 20%; text-align: center;">اختر قناة للتشغيل</h3>
            </div>
        </div>
        
        <div class="sidebar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ابحث عن قناة..." onkeyup="filterChannels()">
            </div>
            <div class="channel-list" id="channelList">
                <div style="color: #666; text-align: center; margin-top: 20px; font-size: 14px;">
                    القنوات ستظهر هنا فور الاستخراج
                </div>
            </div>
        </div>
    </div>

    <script>
        let extractedChannels = [];
        let currentHls = null;
        let currentPlyr = null;
        let currentJwPlayer = null;

        function clearAll() {
            document.getElementById('m3uInput').value = '';
            document.getElementById('searchInput').value = '';
            
            extractedChannels = [];
            document.getElementById("channelList").innerHTML = '<div style="color: #666; text-align: center; margin-top: 20px; font-size: 14px;">تم حذف القنوات</div>';
            
            destroyPlayers();
            document.getElementById('video-container').innerHTML = '<h3 style="color: #444; margin-top: 20%; text-align: center;">تم تفريغ المشغل</h3>';
        }

        function destroyPlayers() {
            if (currentHls) { currentHls.destroy(); currentHls = null; }
            if (currentPlyr) { currentPlyr.destroy(); currentPlyr = null; }
            if (currentJwPlayer) { currentJwPlayer.remove(); currentJwPlayer = null; }
            document.getElementById('video-container').innerHTML = '';
        }

        // محرك الاستخراج المحسن جداً
        function parseM3U() {
            try {
                let rawText = document.getElementById('m3uInput').value.trim();
                if (!rawText) {
                    alert("يرجى لصق الروابط أولاً!");
                    return;
                }

                extractedChannels = [];
                // استبدال أي مسافات عريضة متتالية (Tabs) بمسافة واحدة لتسهيل القراءة
                rawText = rawText.replace(/\t+/g, ' '); 
                const lines = rawText.split(/\r?\n/);
                let tempName = "";

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (!line) continue;

                    if (line.toUpperCase().startsWith('#EXTINF')) {
                        const parts = line.split(',');
                        tempName = parts.length > 1 ? parts.slice(1).join(',').trim() : line.replace(/#EXTINF[:-0-9\s]*/i, '').trim();
                        continue;
                    }

                    // اصطياد الرابط (حتى لو كان ملزوق فيه كلام)
                    const urlMatch = line.match(/(https?:\/\/[^\s]+)/i);

                    if (urlMatch) {
                        let url = urlMatch[1];
                        let nameInline = line.replace(url, '').trim();
                        nameInline = nameInline.replace(/^[-:;|,>]+|[-:;,|<]+$/g, '').trim();

                        let finalName = "قناة " + (extractedChannels.length + 1);

                        if (nameInline) {
                            finalName = nameInline;
                        } else if (tempName) {
                            finalName = tempName;
                        }

                        extractedChannels.push({ name: finalName, url: url });
                        tempName = ""; 
                    } else {
                        if (!line.startsWith('#')) {
                            tempName = line;
                        }
                    }
                }

                // لو مفيش روابط واضحة بالسطر، بنجيب أي رابط في النص كله
                if (extractedChannels.length === 0) {
                    const fallbackUrls = rawText.match(/https?:\/\/[^\s]+/gi);
                    if (fallbackUrls) {
                        fallbackUrls.forEach((u, idx) => extractedChannels.push({ name: "قناة " + (idx + 1), url: u }));
                    }
                }

                if (extractedChannels.length === 0) {
                    alert("لم يتم العثور على روابط صحيحة (تبدأ بـ http أو https)!");
                    return;
                }

                document.getElementById('searchInput').value = '';
                renderChannels('');
                playChannel(0);

            } catch (err) {
                alert("حدث خطأ غير متوقع أثناء الفحص.");
                console.error(err);
            }
        }

        function renderChannels(filterText) {
            const listContainer = document.getElementById("channelList");
            listContainer.innerHTML = "";

            let found = false;
            for (let i = 0; i < extractedChannels.length; i++) {
                const channel = extractedChannels[i];
                if (channel.name.toLowerCase().includes(filterText.toLowerCase())) {
                    found = true;
                    const btn = document.createElement("div");
                    btn.className = "channel-btn";
                    btn.id = "btn-" + i;
                    
                    btn.innerHTML = `<span>${channel.name}</span> <span style="font-size: 10px; color: #88c79c;">CH</span>`;
                    
                    btn.onclick = () => playChannel(i);
                    listContainer.appendChild(btn);
                }
            }

            if (!found) {
                listContainer.innerHTML = '<div style="color: #666; text-align: center; margin-top: 20px;">لا توجد نتائج</div>';
            }
        }

        function filterChannels() {
            const text = document.getElementById("searchInput").value;
            renderChannels(text);
        }

        function playChannel(index) {
            try {
                const channel = extractedChannels[index];
                const playerType = document.getElementById('playerType').value;
                const container = document.getElementById('video-container');

                const allBtns = document.querySelectorAll(".channel-btn");
                allBtns.forEach(b => b.classList.remove("active"));
                const activeBtn = document.getElementById("btn-" + index);
                if(activeBtn) activeBtn.classList.add("active");

                destroyPlayers();

                if (playerType === 'jw') {
                    container.innerHTML = '<div id="jw-player"></div>';
                    
                    let setupConfig = {
                        file: channel.url,
                        width: "100%",
                        height: "100%",
                        autostart: true,
                        stretching: "uniform",
                        playbackRateControls: true, 
                        liveTimeout: 0 
                    };

                    currentJwPlayer = jwplayer("jw-player").setup(setupConfig);

                    currentJwPlayer.on('ready', function() {
                        let isStretched = false;
                        const diagonalCutArrow = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNMTQgMTBsNy03bS02IDBoNnY2bS0xMSA1bC03IDdtNiAwSDN2LTYiLz48L3N2Zz4=";

                        currentJwPlayer.addButton(
                            diagonalCutArrow, 
                            "توسيع/تضييق الصورة", 
                            function() {
                                if (!isStretched) {
                                    currentJwPlayer.setConfig({ stretching: "exactfit" }); 
                                    isStretched = true;
                                } else {
                                    currentJwPlayer.setConfig({ stretching: "uniform" });
                                    isStretched = false;
                                }
                            },
                            "stretch-button"
                        );
                    });

                } else if (playerType === 'plyr') {
                    container.innerHTML = '<video id="plyr-video" controls crossorigin playsinline style="width: 100%; height: 100%; background: #000;"></video>';
                    const video = document.getElementById('plyr-video');

                    const defaultOptions = {
                        controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'pip', 'fullscreen'],
                        settings: ['quality', 'speed']
                    };

                    if (Hls.isSupported()) {
                        currentHls = new Hls();
                        currentHls.loadSource(channel.url);
                        currentHls.attachMedia(video);
                        currentHls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
                            
                            const availableQualities = currentHls.levels.map((l) => l.height);
                            defaultOptions.quality = {
                                default: availableQualities[0],
                                options: availableQualities,
                                forced: true,
                                onChange: (e) => updateQuality(e),
                            };

                            currentPlyr = new Plyr(video, defaultOptions);
                            video.play();
                        });

                        function updateQuality(newQuality) {
                            currentHls.levels.forEach((level, levelIndex) => {
                                if (level.height === newQuality) {
                                    currentHls.currentLevel = levelIndex;
                                }
                            });
                        }
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = channel.url;
                        currentPlyr = new Plyr(video, defaultOptions);
                        video.addEventListener('loadedmetadata', function() {
                            video.play();
                        });
                    }
                }
            } catch (err) {
                console.error("خطأ في التشغيل:", err);
            }
        }
    </script>

</body>
</html>
